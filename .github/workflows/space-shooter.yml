name: Update Pink Contribution Space Shooter

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/space-shooter.yml"
      - ".github/scripts/tint_space_shooter.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install animation tools
        run: python -m pip install --upgrade pip gh-space-shooter Pillow

      - name: Generate contribution space shooter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh-space-shooter "${{ github.repository_owner }}" --output assets/space-shooter.gif --strategy random --fps 30

      - name: Apply the pink profile palette
        run: python .github/scripts/tint_space_shooter.py assets/space-shooter.gif

      - name: Commit updated animation
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add assets/space-shooter.gif
          git diff --staged --quiet || git commit -m "Update pink space shooter GIF"
          git push
