<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Sanya Wadhawan — Applied AI and Machine Learning Engineer</title>
  <desc id="desc">An animated dark pink banner with calm technical accents. It introduces Sanya Wadhawan and her focus on applied, trustworthy AI.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1B0A14"/><stop offset="52%" stop-color="#351021"/><stop offset="100%" stop-color="#210914"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FF9BCB"/><stop offset="55%" stop-color="#FF5CAA"/><stop offset="100%" stop-color="#FF3F91"/><animateTransform attributeName="gradientTransform" type="translate" values="-0.35 0;0.35 0;-0.35 0" dur="8s" repeatCount="indefinite"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FF4FA3" stop-opacity=".34"/><stop offset="100%" stop-color="#FF4FA3" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#FFD6EA" stroke-opacity=".08"/></pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="380" fill="url(#background)"/><rect width="1200" height="380" fill="url(#grid)"/>
  <circle cx="1010" cy="112" r="260" fill="url(#glow)"><animate attributeName="opacity" values=".58;.88;.58" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="1050" cy="78" r="82" fill="#FF9BCB" fill-opacity=".18" filter="url(#soft)"><animateTransform attributeName="transform" type="translate" values="0 0;18 12;0 0" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="1092" cy="291" r="72" fill="#FF3F91" fill-opacity=".16" filter="url(#soft)"><animateTransform attributeName="transform" type="translate" values="0 0;-16 -10;0 0" dur="8s" repeatCount="indefinite"/></circle>
  <g fill="none" stroke="url(#accent)" stroke-linecap="round">
    <path d="M804 100h80l31 31h86" stroke-width="2" stroke-opacity=".72"><animate attributeName="stroke-opacity" values=".35;.9;.35" dur="5s" repeatCount="indefinite"/></path>
    <path d="M865 259h61l32-32h132" stroke-width="2" stroke-opacity=".52"><animate attributeName="stroke-opacity" values=".24;.78;.24" dur="5s" begin="1.3s" repeatCount="indefinite"/></path>
    <path d="M997 131v50l35 35" stroke-width="2" stroke-opacity=".52"><animate attributeName="stroke-opacity" values=".24;.78;.24" dur="5s" begin="2.6s" repeatCount="indefinite"/></path>
  </g>
  <g fill="#FFB6D8"><circle cx="804" cy="100" r="5"><animate attributeName="r" values="4;6;4" dur="4s" repeatCount="indefinite"/></circle><circle cx="1001" cy="131" r="5"><animate attributeName="r" values="4;6;4" dur="4s" begin="1s" repeatCount="indefinite"/></circle><circle cx="865" cy="259" r="5"><animate attributeName="r" values="4;6;4" dur="4s" begin="2s" repeatCount="indefinite"/></circle><circle cx="1090" cy="227" r="5"><animate attributeName="r" values="4;6;4" dur="4s" begin="3s" repeatCount="indefinite"/></circle></g>
  <rect x="76" y="81" width="86" height="8" rx="4" fill="url(#accent)"/>
  <text x="76" y="147" fill="#FFF7FF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="46" font-weight="700" letter-spacing="-1">Sanya Wadhawan</text>
  <text x="76" y="190" fill="#FFD6EA" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="600">Applied AI / ML Engineer</text>
  <text x="76" y="233" fill="#FFB6D8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">Agentic AI  •  Explainability  •  LLM Evaluation  •  Computer Vision</text>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600"><rect x="76" y="278" width="132" height="38" rx="19" fill="#FF5CAA" fill-opacity=".18" stroke="#FF8FC5" stroke-opacity=".64"/><text x="142" y="302" fill="#FFF0F7" text-anchor="middle">INDUSTRY-READY</text><rect x="220" y="278" width="145" height="38" rx="19" fill="#FF5CAA" fill-opacity=".18" stroke="#FF8FC5" stroke-opacity=".64"/><text x="292.5" y="302" fill="#FFF0F7" text-anchor="middle">IMPACT-FOCUSED</text></g>
</svg>
